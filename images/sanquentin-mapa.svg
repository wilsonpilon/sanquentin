<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1340" viewBox="0 0 1840 1340" role="img" aria-labelledby="title description">
  <title id="title">San Quentin — mapa da penitenciária</title>
  <desc id="description">Mapa geográfico dos 22 locais, com nove objetos de posição inicial fixa. Norte para cima. Setas indicam o sentido das passagens; linhas tracejadas marcam condições da cela, do túnel e do necrotério. Notas sobre perigos e objetos aleatórios na parte inferior.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .room { fill: #182638; stroke: #52667f; stroke-width: 2; }
      .start { fill: #173653; stroke: #60a5fa; }
      .danger { fill: #392c24; stroke: #e6a454; }
      .exit { fill: #163a35; stroke: #5ee0aa; }
      .number { font-size: 15px; font-weight: 700; fill: #94a3b8; letter-spacing: 2px; }
      .name { font-size: 23px; font-weight: 650; }
      .item { font-size: 18px; fill: #fcd68a; }
      .note { font-size: 16px; fill: #b6c5d8; }
      .small { font-size: 17px; fill: #b6c5d8; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; fill: #cbd5e1; }
      .link { fill: none; stroke: #94a3b8; stroke-width: 3; marker-start: url(#normal); marker-end: url(#normal); }
      .one { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#normal); }
      .cell { fill: none; stroke: #f87171; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#cell); }
      .tunnel { fill: none; stroke: #fbbf24; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#tunnel); }
      .lamp { fill: none; stroke: #67e8f9; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#lamp); }
      .badge { font-size: 15px; font-weight: 800; paint-order: stroke; stroke: #0b1422; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#94a3b8"/></marker>
    <marker id="cell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#f87171"/></marker>
    <marker id="tunnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#fbbf24"/></marker>
    <marker id="lamp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1840" height="1340" fill="#0b1422"/>
  <text x="40" y="62" font-size="40" font-weight="800" letter-spacing="3">SAN QUENTIN</text>
  <text x="42" y="97" font-size="22" fill="#b6c5d8">Mapa da penitenciária · BASIC / MSX1</text>
  <text x="42" y="136" class="small">22 locais · Objetos nas posições iniciais · Contém spoilers</text>
  <g transform="translate(1620 80)">
    <path d="M0 30 V-35 M-33 0 H33" stroke="#94a3b8" stroke-width="2"/>
    <path d="M0 -40 L-6 -25 L6 -25 Z" fill="#e2e8f0"/>
    <text x="0" y="-48" text-anchor="middle" font-size="17" font-weight="700">N</text>
    <text x="0" y="51" text-anchor="middle" font-size="17">S</text>
    <text x="-48" y="6" text-anchor="middle" font-size="17">O</text>
    <text x="48" y="6" text-anchor="middle" font-size="17">L</text>
  </g>
  <text x="1730" y="87" class="small">Norte</text>
  <text x="1730" y="111" class="small">para cima</text>

  <!-- Connections follow the original six-column room numbering. -->
  <g id="connections">
    <path data-from="1" data-to="2" class="cell" d="M300 237 H340"/>
    <path data-from="2" data-to="1" class="one" d="M340 267 H300"/>
    <text x="320" y="226" text-anchor="middle" class="badge" style="fill:#f87171">C</text>
    <path data-pair="2 3" class="link" d="M600 250 H640"/>
    <path data-pair="3 4" class="link" d="M900 250 H940"/>
    <path data-pair="5 6" class="link" d="M1500 250 H1540"/>
    <path data-pair="7 8" class="link" d="M300 460 H340"/>
    <path data-pair="10 11" class="link" d="M1200 460 H1240"/>
    <path data-from="11" data-to="12" class="tunnel" d="M1500 447 H1540"/>
    <path data-from="12" data-to="11" class="lamp" d="M1540 477 H1500"/>
    <text x="1520" y="436" text-anchor="middle" class="badge" style="fill:#fbbf24">T</text>
    <text x="1520" y="501" text-anchor="middle" class="badge" style="fill:#67e8f9">L</text>
    <path data-pair="14 15" class="link" d="M600 670 H640"/>
    <path data-pair="15 16" class="link" d="M900 670 H940"/>

    <path data-pair="2 8" class="link" d="M470 310 V400"/>
    <path data-pair="3 9" class="link" d="M770 310 V400"/>
    <path data-pair="4 10" class="link" d="M1070 310 V400"/>
    <path data-pair="5 11" class="link" d="M1370 310 V400"/>
    <path data-from="6" data-to="12" class="one" d="M1655 310 V400"/>
    <path data-from="12" data-to="6" class="lamp" d="M1685 400 V310"/>
    <text x="1701" y="361" class="badge" style="fill:#67e8f9">L</text>
    <path data-pair="7 13" class="link" d="M170 520 V610"/>
    <path data-pair="8 14" class="link" d="M470 520 V610"/>
    <path data-from="11" data-to="17" class="tunnel" d="M1355 520 V610"/>
    <path data-from="17" data-to="11" class="one" d="M1385 610 V520"/>
    <text x="1329" y="572" class="badge" style="fill:#fbbf24">T</text>
    <path data-from="12" data-to="18" class="lamp" d="M1655 520 V610"/>
    <path data-from="18" data-to="12" class="one" d="M1685 610 V520"/>
    <text x="1629" y="572" class="badge" style="fill:#67e8f9">L</text>
    <path data-pair="13 19" class="link" d="M170 730 V820"/>
    <path data-pair="14 20" class="link" d="M470 730 V820"/>
    <path data-pair="15 21" class="link" d="M770 730 V820"/>
    <path data-pair="18 24" class="link" d="M1670 730 V820"/>
  </g>

  <g id="room-1" transform="translate(40 190)">
    <rect class="room start" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">01 · INÍCIO</text>
    <text x="18" y="57" class="name">Cela inicial</text>
    <text x="18" y="89" class="item">Serra</text>
  </g>
  <g id="room-2" transform="translate(340 190)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">02</text>
    <text x="18" y="57" class="name">Corredor de celas</text>
  </g>
  <g id="room-3" transform="translate(640 190)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">03</text>
    <text x="18" y="57" class="name">Refeitório</text>
    <text x="18" y="89" class="item">Colher</text>
  </g>
  <g id="room-4" transform="translate(940 190)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">04</text>
    <text x="18" y="57" class="name">Enfermaria</text>
    <text x="18" y="89" class="item">Lençol</text>
  </g>
  <g id="room-5" transform="translate(1240 190)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">05</text>
    <text x="18" y="57" class="name">Almoxarifado</text>
    <text x="18" y="89" class="item">Escada</text>
  </g>
  <g id="room-6" transform="translate(1540 190)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">06</text>
    <text x="18" y="57" class="name">Horta</text>
  </g>
  <g id="room-7" transform="translate(40 400)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">07</text>
    <text x="18" y="57" class="name">Biblioteca</text>
    <text x="18" y="89" class="item">Livro</text>
  </g>
  <g id="room-8" transform="translate(340 400)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">08</text>
    <text x="18" y="57" class="name">Salão de visitas</text>
  </g>
  <g id="room-9" transform="translate(640 400)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">09</text>
    <text x="18" y="57" class="name">Cozinha</text>
  </g>
  <g id="room-10" transform="translate(940 400)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">10</text>
    <text x="18" y="57" class="name">Capela</text>
    <text x="18" y="89" class="item">Crucifixo</text>
  </g>
  <g id="room-11" transform="translate(1240 400)">
    <rect class="room danger" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">11</text>
    <text x="18" y="57" class="name">Túnel secreto</text>
    <text x="18" y="89" class="note">Leste e sul: condição T</text>
  </g>
  <g id="room-12" transform="translate(1540 400)">
    <rect class="room danger" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">12</text>
    <text x="18" y="57" class="name">Necrotério</text>
    <text x="18" y="89" class="note">Todas as saídas: condição L</text>
  </g>
  <g id="room-13" transform="translate(40 610)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">13</text>
    <text x="18" y="57" class="name">Sala do diretor</text>
  </g>
  <g id="room-14" transform="translate(340 610)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">14</text>
    <text x="18" y="57" class="name">Corredor</text>
  </g>
  <g id="room-15" transform="translate(640 610)">
    <rect class="room danger" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">15 · PERIGO</text>
    <text x="18" y="57" class="name">Pátio</text>
    <text x="18" y="89" class="note">Apague a lanterna antes!</text>
  </g>
  <g id="room-16" transform="translate(940 610)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">16</text>
    <text x="18" y="57" class="name">Oficina</text>
    <text x="18" y="89" class="item">Corda</text>
  </g>
  <g id="room-17" transform="translate(1240 610)">
    <rect class="room danger" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">17</text>
    <text x="18" y="57" class="name">Beira do rio</text>
    <text x="18" y="87" class="item">NADAR → moeda</text>
    <text x="18" y="109" class="note">Não nade com a serra.</text>
  </g>
  <g id="room-18" transform="translate(1540 610)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">18</text>
    <text x="18" y="57" class="name">Guarita leste</text>
  </g>
  <g id="room-19" transform="translate(40 820)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">19</text>
    <text x="18" y="57" class="name">Cela surda</text>
    <text x="18" y="89" class="item">Osso</text>
  </g>
  <g id="room-20" transform="translate(340 820)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">20</text>
    <text x="18" y="57" class="name">Lavanderia</text>
    <text x="18" y="89" class="item">Uniforme</text>
  </g>
  <g id="room-21" transform="translate(640 820)">
    <rect class="room" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">21</text>
    <text x="18" y="57" class="name">Guarita sul</text>
  </g>
  <g id="room-24" transform="translate(1540 820)">
    <rect class="room exit" width="260" height="120" rx="12"/>
    <text x="18" y="26" class="number">24 · SAÍDA</text>
    <text x="18" y="57" class="name">Portão de saída</text>
    <text x="18" y="87" class="item" style="fill:#5ee0aa">ABRIR com a chave</text>
    <text x="18" y="109" class="note">Sem o osso → liberdade</text>
  </g>
  <text x="1220" y="870" text-anchor="middle" class="small">22 e 23 não são salas descritas.</text>
  <text x="1220" y="900" text-anchor="middle" class="small">Não há passagem nessa área.</text>

  <path d="M40 980 H1800" stroke="#334155"/>
  <g transform="translate(40 1020)">
    <text class="heading">COMO LER AS PASSAGENS</text>
    <path class="link" d="M3 32 H58"/>
    <text x="78" y="38" class="body">Passagem normal, nos dois sentidos.</text>
    <text y="76" class="body"><tspan fill="#f87171" font-weight="700">C</tspan><tspan> · Cela → corredor: SERRAR com a serra.</tspan></text>
    <text y="110" class="body"><tspan fill="#fbbf24" font-weight="700">T</tspan><tspan> · CAVAR e continuar carregando a colher.</tspan></text>
    <text x="24" y="137" class="small">Não carregue a escada ao cavar.</text>
    <text y="171" class="body"><tspan fill="#67e8f9" font-weight="700">L</tspan><tspan> · Carregar a lanterna acesa para sair.</tspan></text>
    <text y="207" class="small">Tracejado: condição só no sentido da seta.</text>
    <text y="234" class="small">L nas setas azuis = lanterna; na bússola = leste.</text>
  </g>
  <g transform="translate(650 1020)">
    <text class="heading">OBJETOS ALEATÓRIOS</text>
    <text y="38" class="body">Um único sorteio: J de 3 a 17, inclusive.</text>
    <text y="76" class="body">Canivete: sala J</text>
    <text x="310" y="76" class="small">03–17</text>
    <text y="110" class="body">Lanterna: sala J − 1</text>
    <text x="310" y="110" class="small">02–16</text>
    <text y="144" class="body">Chave: sala J + 3</text>
    <text x="310" y="144" class="small">06–20</text>
    <text y="180" class="small">Chave confiscada: novo sorteio para os três</text>
    <text y="207" class="small">objetos que não estiverem no inventário.</text>
    <text y="234" class="small">Moeda: obtida no rio, não é sorteada.</text>
  </g>
  <g transform="translate(1240 1020)">
    <text class="heading">LEMBRETES PARA A FUGA</text>
    <text y="38" class="body">Dourado nas salas: objetos iniciais fixos.</text>
    <text y="76" class="body">Inventário: até três objetos.</text>
    <text y="110" class="body">Uniforme: protege contra o guarda.</text>
    <text y="144" class="body">Guarda: encontro aleatório.</text>
    <text y="180" class="small">As setas mostram as ligações normais.</text>
    <text y="207" class="small">Particularidades do original e roteiro:</text>
    <text y="234" class="small">consulte docs/mapa.md e docs/solution.md.</text>
  </g>
  <text x="40" y="1310" font-size="15" fill="#94a3b8">SAN QUENTIN · Mapa baseado nas salas e regras do jogo · Posições podem mudar ao pegar, largar ou perder objetos.</text>
</svg>
